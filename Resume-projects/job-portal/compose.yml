services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobportal
      POSTGRES_USER: jobportal
      POSTGRES_PASSWORD: jobportal
    ports: ["5432:5432"]
    volumes: [jobportal_data:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/jobportal
      DATABASE_USERNAME: jobportal
      DATABASE_PASSWORD: jobportal
      JWT_SECRET: local-development-secret-key-change-me
    ports: ["8080:8080"]
volumes:
  jobportal_data:
